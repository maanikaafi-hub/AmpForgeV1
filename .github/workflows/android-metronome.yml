name: Android metronome

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit test and package debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "Android SDK: $ANDROID_HOME"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run unit tests
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest > "$RUNNER_TEMP/gradle-test.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 80 "$RUNNER_TEMP/gradle-test.log"
            python3 ci_report_failure.py "$RUNNER_TEMP/gradle-test.log" "Gradle unit tests failed"
            exit "$status"
          fi
          tail -n 30 "$RUNNER_TEMP/gradle-test.log"

      - name: Build installable debug APK
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug > "$RUNNER_TEMP/gradle-apk.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 80 "$RUNNER_TEMP/gradle-apk.log"
            python3 ci_report_failure.py "$RUNNER_TEMP/gradle-apk.log" "APK build failed"
            exit "$status"
          fi
          tail -n 30 "$RUNNER_TEMP/gradle-apk.log"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maani-mechanical-metronome-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
