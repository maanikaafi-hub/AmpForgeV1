# =============================================================================
#  AmpForge - continuous integration
#
#  Jobs
#    verify-sources  every file the build needs is present (fast, Linux)
#    build-windows   configures with Visual Studio 2022 / x64, builds the VST3
#                    in Release, verifies the bundle and uploads it
#    validate        builds and runs the automated DSP / parameter tests
#
#  Everything the build needs is fetched here; nothing has to be generated by
#  hand on a developer machine.
# =============================================================================
name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # --- pinned dependency -------------------------------------------------------
  JUCE_REPO:   juce-framework/JUCE
  JUCE_TAG:    "8.0.15"
  JUCE_COMMIT: "91ad83ae34a81e0833b1a2b0866f54846370ae53"   # == tag 8.0.15
  JUCE_DIR:    ext/JUCE

  # --- build -------------------------------------------------------------------
  BUILD_DIR:    build
  CONFIG:       Release
  PLUGIN_TARGET: AmpForge_VST3

  # --- artefact ----------------------------------------------------------------
  VST3_BUNDLE:  build/AmpForge_artefacts/Release/VST3/AmpForge.vst3
  VST3_BINARY:  build/AmpForge_artefacts/Release/VST3/AmpForge.vst3/Contents/x86_64-win/AmpForge.vst3
  ARTIFACT_NAME: AmpForge-windows-x64-vst3

jobs:
  # ===========================================================================
  verify-sources:
    name: Verify repository files
    runs-on: ubuntu-latest
    steps:
      - name: Check out AmpForge
        uses: actions/checkout@v7

      - name: Check that every expected file exists
        run: bash Scripts/verify_sources.sh

  # ===========================================================================
  build-windows:
    name: Build VST3 (Windows x64, MSVC)
    runs-on: windows-latest
    needs: verify-sources

    steps:
      - name: Check out AmpForge
        uses: actions/checkout@v7

      - name: Fetch JUCE ${{ env.JUCE_TAG }} (pinned to a commit)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.JUCE_REPO }}
          ref: ${{ env.JUCE_COMMIT }}
          path: ${{ env.JUCE_DIR }}
          fetch-depth: 1

      - name: Verify the JUCE pin
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C "${JUCE_DIR}" rev-parse HEAD)"
          echo "JUCE HEAD = ${actual} (expected ${JUCE_COMMIT})"
          if [ "${actual}" != "${JUCE_COMMIT}" ]; then
            echo "::error::JUCE pin mismatch - expected ${JUCE_COMMIT}, got ${actual}"
            exit 1
          fi

      - name: Show the toolchain
        shell: bash
        run: |
          cmake --version
          echo "---"
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH}"
          echo "workspace: ${GITHUB_WORKSPACE}"
          ls "${JUCE_DIR}" | head -n 5

      - name: Configure CMake (Visual Studio 2022, x64)
        shell: bash
        run: |
          cmake -S . -B "${BUILD_DIR}" -G "Visual Studio 17 2022" -A x64

      - name: Build ${{ env.PLUGIN_TARGET }} (${{ env.CONFIG }})
        shell: bash
        run: |
          cmake --build "${BUILD_DIR}" --config "${CONFIG}" --target "${PLUGIN_TARGET}" --parallel

      - name: Verify the VST3 bundle
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "${VST3_BUNDLE}" ]; then
            echo "::error::VST3 bundle not found at ${VST3_BUNDLE}"
            echo "--- contents of the artefact directory ---"
            ls -R "${BUILD_DIR}/AmpForge_artefacts" || true
            exit 1
          fi

          if [ ! -f "${VST3_BINARY}" ]; then
            echo "::error::VST3 binary not found at ${VST3_BINARY}"
            echo "--- contents of the bundle ---"
            ls -R "${VST3_BUNDLE}" || true
            exit 1
          fi

          echo "Found $(stat -c%s "${VST3_BINARY}") byte VST3 binary:"
          ls -l "${VST3_BINARY}"

      - name: Upload the VST3 bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.VST3_BUNDLE }}
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## AmpForge build"
            echo ""
            echo "* JUCE: \`${JUCE_TAG}\` (\`${JUCE_COMMIT}\`)"
            echo "* Toolchain: Visual Studio 2022, x64, ${CONFIG}"
            echo "* Bundle: \`${VST3_BUNDLE}\`"
            echo "* Artefact: \`${ARTIFACT_NAME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Troubleshooting dump on failure
        if: failure()
        shell: bash
        run: |
          echo "--- build directory ---"
          ls -R "${BUILD_DIR}" | head -n 100 || true
          echo "--- CMake configuration log ---"
          cat "${BUILD_DIR}/CMakeFiles/CMakeConfigureLog.yaml" 2>/dev/null | tail -n 40 || true

  # ===========================================================================
  validate:
    name: Automated validation tests
    runs-on: windows-latest

    steps:
      - name: Check out AmpForge
        uses: actions/checkout@v7

      - name: Fetch JUCE ${{ env.JUCE_TAG }} (pinned to a commit)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.JUCE_REPO }}
          ref: ${{ env.JUCE_COMMIT }}
          path: ${{ env.JUCE_DIR }}
          fetch-depth: 1

      - name: Configure with tests enabled
        shell: bash
        run: |
          cmake -S . -B "${BUILD_DIR}-tests" -G "Visual Studio 17 2022" -A x64 -DAMPFORGE_BUILD_TESTS=ON

      - name: Build AmpForgeTests
        shell: bash
        run: |
          cmake --build "${BUILD_DIR}-tests" --config "${CONFIG}" --target AmpForgeTests --parallel

      - name: Run the tests
        shell: bash
        run: |
          ctest --test-dir "${BUILD_DIR}-tests" -C "${CONFIG}" --output-on-failure
